<svg viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Side: Clean Monogram Emblem -->
  <!-- Outer Ring -->
  <circle cx="75" cy="75" r="48" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3" />
  <circle cx="75" cy="75" r="42" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" />
  
  <!-- Solid Center Circle -->
  <circle cx="75" cy="75" r="34" fill="url(#goldGradient)" />
  
  <!-- Symmetrical Monogram Text -->
  <text x="75" y="87" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">T</text>

  <!-- Right Side: Brand Typography -->
  <!-- "TRUST" Text -->
  <text x="165" y="70" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#darkGradient)" letter-spacing="1.5">TRUST</text>
  <!-- "MANAGEMENT" Text -->
  <text x="165" y="105" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="500" fill="#71717a" letter-spacing="5.5">MANAGEMENT</text>
  
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>
  </defs>
</svg>
